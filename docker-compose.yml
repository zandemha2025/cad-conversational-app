version: "3.9"

# ScaleCAD local dev stack
# Start with: docker-compose up
# API will be at http://localhost:8000
# API docs at  http://localhost:8000/api/docs

services:
  # ── FastAPI backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ScaleCAD API
      ENVIRONMENT: development
      DEBUG: "true"
      SECRET_KEY: local-dev-secret-key-change-in-prod
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5174"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # ↓ Fill these in or leave blank for demo/stub mode
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_JWT_SECRET: ""
      GEMINI_API_KEY: ""
      ZOO_API_KEY: ""
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY: ""
      R2_SECRET_KEY: ""
      R2_BUCKET: scalecad-local
      R2_PUBLIC_URL: http://localhost:8000/mock
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      SUPABASE_JWT_SECRET: ""
      GEMINI_API_KEY: ""
      ZOO_API_KEY: ""
      SECRET_KEY: local-dev-secret-key-change-in-prod
    depends_on:
      - redis
    volumes:
      - ./backend:/app

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
