# Fly.io deployment — ScaleCAD API server
# Deploy with: fly deploy --config fly.toml
# First time: fly launch --no-deploy, then fly secrets set KEY=VALUE, then fly deploy

app = "scalecad-api"
primary_region = "iad"   # US East — change to "lhr" for Europe, "nrt" for Asia
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

[env]
  APP_NAME      = "ScaleCAD API"
  APP_VERSION   = "0.2.0"
  ENVIRONMENT   = "production"
  DEBUG         = "false"
  PORT          = "8000"
  CORS_ORIGINS  = "http://localhost:5173,http://localhost:5174,https://scalecad.app,https://www.scalecad.app,https://suspicious-bell.vercel.app,https://eager-euler.vercel.app,https://cad-conversational-app.vercel.app"

# Secrets — set via: ./setup.sh (recommended) or fly secrets set KEY=VALUE
# Required secrets:
#   SECRET_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   SUPABASE_ANON_KEY
#   SUPABASE_JWT_SECRET
#   DATABASE_URL
#   GEMINI_API_KEY
#   ZOO_API_KEY
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY
#   R2_SECRET_KEY
#   REDIS_URL

[processes]
  app    = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A app.core.celery_app worker --loglevel=info -Q normal,low --concurrency=2"

[[services]]
  internal_port = 8000
  protocol      = "tcp"
  processes     = ["app"]

  [[services.ports]]
    handlers = ["http"]
    port     = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [[services.http_checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"
    method       = "GET"
    path         = "/api/health"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 2
  memory    = "2gb"
  processes = ["app"]

[[vm]]
  cpu_kind  = "shared"
  cpus      = 2
  memory    = "2gb"
  processes = ["worker"]

# For WebSocket support (chat streaming)
[experimental]
  allow_public_ports = false
